[package]
name = "discogs-xml-converter"
version = "0.1.0"
edition = "2021"
description = "Convert Discogs XML data dumps to CSV, with optional artist filtering"

[dependencies]
quick-xml = "0.40"
csv = "1.3"
flate2 = "1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
crossbeam-channel = "0.5"
memchr = "2"
rayon = "1.10"
postgres = "0.19"
itoa = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
wxyc-etl = "0.8.0"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
