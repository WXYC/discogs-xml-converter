[package]
name = "discogs-xml-converter"
version = "0.1.0"
edition = "2021"
description = "Convert Discogs XML data dumps to CSV, with optional artist filtering"

[dependencies]
quick-xml = "0.37"
csv = "1.3"
flate2 = "1.0"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
